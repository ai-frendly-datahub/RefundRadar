category_name: refund
display_name: 환급/보조금 레이더
data_quality:
  priority: P0
  primary_motion: compliance-risk
  weakest_dimension: operational_depth
  quality_outputs:
    freshness_report: reports/refund_quality.json
    dated_freshness_report_pattern: reports/refund_YYYYMMDD_quality.json
    tracked_event_models:
      - refund_claim_window
      - recall_refund_notice
      - complaint_resolution
      - refund_policy_change
  event_models:
    refund_policy_change:
      fields: [provider, policy_scope, change_type, effective_date, applies_from, source_url, collected_at]
      notes: "판매자·항공사·플랫폼의 환불 정책 변경을 일반 뉴스와 분리해 추적한다."
    refund_claim_window:
      fields: [case_id, claim_start_date, claim_deadline, eligibility_summary, claim_url, payout_amount, source_url, collected_at]
      notes: "집단소송·세금 환급·리베이트 청구 기간을 별도 운영 이벤트로 유지한다."
    recall_refund_notice:
      fields: [product_or_service, seller_or_agency, refund_action, recall_status, notice_date, resolution_status, source_url, collected_at]
      notes: "리콜·환불 공지는 제품/서비스와 처리 상태를 함께 추적한다."
    complaint_resolution:
      fields: [case_id, regulator, seller, complaint_type, resolution_status, resolution_date, compensation_amount, source_url, collected_at]
      notes: "소비자 민원 해결·제재·합의 결과는 커뮤니티 complaint와 별도 후행 검증 이벤트로 유지한다."
  canonical_keys:
    refund_case:
      fields: [provider, normalized_case_title, notice_date, source_url]
      notes: "환불/리콜/구제 사건 중복 제거용 key. 사건명만 같아도 provider가 다르면 분리한다."
    policy:
      fields: [provider, policy_scope, effective_date, source_url]
      notes: "판매자·항공사 정책 diff와 적용일 추적용 key."
    complaint:
      fields: [regulator, seller, complaint_type, resolution_date, source_url]
      notes: "공식 complaint resolution과 커뮤니티 불만을 cross-reference하기 위한 key."
  freshness_sla:
    refund_policy_change:
      max_age_days: 3
      event_date_field: effective_date
      observed_date_field: collected_at
    refund_claim_window:
      max_age_days: 1
      event_date_field: claim_deadline
      observed_date_field: collected_at
    recall_refund_notice:
      max_age_days: 1
      event_date_field: notice_date
      observed_date_field: collected_at
    complaint_resolution:
      max_age_days: 2
      event_date_field: resolution_date
      observed_date_field: collected_at
  quality_gates:
    - "환불 가능 조건과 실제 처리 상태를 분리"
    - "정책 변경일과 적용 시작일을 별도 필드로 유지"
    - "커뮤니티 불만은 공식 구제 결과와 cross-reference로만 사용"
    - "claim deadline 파싱 실패 시 임의 추정하지 않고 확인 필요 상태로 표시"
source_backlog:
  policy_diff_candidates:
    - id: us_dot_airline_customer_service_dashboard
      name: "US DOT Airline Customer Service Dashboard"
      url: https://www.transportation.gov/airconsumer/airline-customer-service-dashboard
      reason: "항공사별 환불/취소 정책 비교 후보. 정책 페이지 diff와 적용일 parser 검증 후 활성화."
      required_before_enable: [policy_diff_parser, effective_date_parser, evidence_url_check]
    - id: merchant_refund_policy_pages
      name: "Seller refund policy pages"
      reason: "주요 판매자별 환불 정책 변경 추적 후보. ToS·robots·diff 안정성 검토 전 기본 비활성."
      required_before_enable: [tos_review, robots_review, policy_scope_taxonomy]
  complaint_resolution_candidates:
    - id: cfpb_consumer_complaint_database
      name: "CFPB Consumer Complaint Database"
      url: https://www.consumerfinance.gov/data-research/consumer-complaints/
      reason: "소비자 금융 민원 처리 상태와 회사 응답을 complaint_resolution 이벤트로 보강할 후보."
      required_before_enable: [api_contract_test, pii_field_review, resolution_status_mapping]
    - id: consumer24_damage_relief
      name: "소비자24 피해구제"
      url: https://www.consumer.go.kr/consumer/subIndex/46.do
      reason: "한국 소비자 피해구제 처리 흐름 후보. 개인정보와 사건 상세 공개 범위 검토 후 보조 레이어로 활성화."
      required_before_enable: [privacy_review, case_status_taxonomy, evidence_url_check]
  community_complaint_candidates:
    - id: reddit_refund_complaint_threads
      name: "Reddit refund complaint subreddits"
      url: https://www.reddit.com/
      reason: "환급·chargeback·소비자권리 관련 커뮤니티 불만 보조 신호. RefundRadar local collector의 reddit adapter와 개인정보 검토 전에는 활성화하지 않음."
      required_before_enable: [reddit_api_contract_test, oauth_credentials, pii_review, complaint_signal_parser]
