  url: https://www.wetax.go.kr/main/
  enabled: false
  language: ko
  country: KR
  trust_tier: T1_official
  collection_tier: C3_javascript
  content_type: local_tax_refund_portal
  producer_role: government
  info_purpose: [local_tax_refund, refund_claim_window, refund_policy_change, operational_event]
  notes: "DISABLED 2026-04-23: main portal returns an index page rather than a public refund notice list. 개인별 조회는 수행하지 않으며 안정적인 공지/list URL 확인 전까지 품질 missing source로 남기지 않음."
  config:
    disabled_reason: portal_index_without_public_notice_list
    required_before_enable: [public_notice_page_contract, no_personal_lookup_review, browser_smoke]
    wait_for: ".content"
    fallback_wait_for: body
    bypass_crawl_health: true
    timeout: 20000
    navigation_retries: 3
    event_model: refund_claim_window
    event_date_field: published
    observed_date_field: collected_at
    canonical_key_fields: [provider, policy_scope, source_url]
    status_fields: [claim_deadline, refund_action, portal_status]
    freshness_sla_days: 1

# === 한국 소비자 보호 소스 ===
- name: 한국소비자원
  type: javascript
  url: https://www.kca.go.kr/home/main.do
  enabled: false
  language: ko
  country: KR
  trust_tier: T1_official
  collection_tier: C2_js
  content_type: complaint_resolution_notice
  producer_role: regulator
  info_purpose: [consumer_protection, complaint_resolution, recall_refund_notice, operational_event]
  notes: "DISABLED 2026-04-23: homepage collection only returns the generic KCA index, not a complaint-resolution list. 피해구제/분쟁조정 list URL 확인 후 재활성."
  config:
    disabled_reason: homepage_not_operational_notice_list
    required_before_enable: [stable_damage_relief_or_dispute_list_url, browser_smoke]
    wait_for: body
    bypass_crawl_health: true
    timeout: 20000
    event_model: complaint_resolution
    event_date_field: published
    observed_date_field: collected_at
    canonical_key_fields: [regulator, seller, normalized_case_title, source_url]
    status_fields: [resolution_status, compensation_amount, refund_action]
    freshness_sla_days: 2

- name: 한국소비자원 리콜정보
  type: javascript
  url: https://www.consumer.go.kr/recall/recall/list.do
  enabled: false
  language: ko
  country: KR
  trust_tier: T1_official
  collection_tier: C2_js
  content_type: recall_refund_notice
  producer_role: regulator
  info_purpose: [recall, refund_action, recall_refund_notice, operational_event]
  notes: "DISABLED 2026-04-23: live Playwright smoke returns an empty title/body for the recall list. Stable public list/API is required before enabling."
  config:
    disabled_reason: empty_browser_response
    required_before_enable: [stable_recall_list_url_or_api, browser_smoke]
    wait_for: body
    bypass_crawl_health: true
    timeout: 20000
    navigation_retries: 3
    event_model: recall_refund_notice
    event_date_field: published
    observed_date_field: collected_at
    canonical_key_fields: [product_or_service, seller_or_agency, source_url]
    status_fields: [recall_status, refund_action, resolution_status]
    freshness_sla_days: 1

- name: 공정거래위원회 보도자료
  type: javascript
  url: https://www.ftc.go.kr/www/selectReportUserList.do
  enabled: false
  language: ko
  country: KR
  trust_tier: T1_official
  collection_tier: C2_js
  content_type: consumer_enforcement
  producer_role: regulator
  info_purpose: [enforcement_action, complaint_resolution, refund_policy_change, operational_event]
  notes: "DISABLED 2026-04-13: selectReportUserList.do와 공식 보도자료 list 후보가 live probe에서 connection reset/400을 반환함. 안정적인 list URL 확인 전까지 오류 소스로 남기지 않음."
  config:
    disabled_reason: official_list_connection_reset
    required_before_enable: [stable_official_list_url, browser_smoke]
    wait_for: ".board_list"
    event_model: complaint_resolution
    event_date_field: published
    observed_date_field: collected_at
    canonical_key_fields: [regulator, seller, normalized_case_title, source_url]
    status_fields: [resolution_status, compensation_amount, refund_action]
    freshness_sla_days: 2

